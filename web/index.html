<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>娱乐档案 · 个人档案馆</title>
<script>
try{
  var m = localStorage.getItem('grdag_mode'), t = localStorage.getItem('grdag_theme'), z = localStorage.getItem('grdag_size');
  if (m) document.documentElement.dataset.mode = m;
  if (t) document.documentElement.dataset.theme = t;
  if (z) document.documentElement.dataset.size = z;
  if (localStorage.getItem('grdag_sidebar_collapsed') === 'true') document.documentElement.dataset.sidebarCollapsed = 'true';
}catch(e){}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f2f2f7'/%3E%3Crect x='14' y='14' width='36' height='7' rx='2' fill='%230088ff'/%3E%3Cpath d='M18 21v28h28V21' stroke='%230088ff' stroke-width='3' fill='none'/%3E%3Cpath d='M27 33h10' stroke='%230088ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/presentation.css">
<link rel="stylesheet" href="/static/immersive.css">
<link rel="stylesheet" href="/static/series-immersive.css">
<link rel="stylesheet" href="/static/immersive-audio.css">
<link rel="stylesheet" href="/static/archive-ui.css">
<link rel="stylesheet" href="/static/home.css">
<link rel="stylesheet" href="/static/background-editor.css">
<link rel="stylesheet" href="/static/audio-player.css">
</head>
<body>

<a class="skip-link" href="#homeView">跳到主要内容</a>

<aside class="app-sidebar" id="appSidebar" aria-label="主导航">
  <nav class="sidebar-nav" aria-label="浏览">
    <button class="sidebar-nav-item" id="navHome" data-app-nav="home" aria-current="page" title="首页">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>首页</span>
    </button>
    <button class="sidebar-nav-item" id="navArchive" data-app-nav="archive" title="展厅">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="9" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="14" y="13" width="7" height="7" rx="1"/><rect x="3" y="16" width="7" height="4" rx="1"/></svg><span>展厅</span>
    </button>
    <button class="sidebar-nav-item" id="navImmersive" title="沉浸浏览">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4"/><circle cx="9" cy="8" r="1"/></svg><span>沉浸浏览</span>
    </button>
    <button class="sidebar-nav-item" id="musicOpenBtn" title="音乐列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>音乐列表</span></button>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-global" aria-label="全局操作">
    <button class="btn btn-primary sidebar-add" id="addBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>添加作品</span></button>
    <button class="sidebar-action" id="undoBtn" title="撤销上一步" aria-label="撤销上一步" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h9a6 6 0 0 1 6 6v1"/></svg><span>撤销上一步</span></button>
    <div class="sidebar-appearance" aria-label="外观">
      <button class="icon-btn" id="modeBtn" title="切换深色或浅色模式" aria-label="切换深色或浅色模式"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
      <button class="icon-btn" id="themeBtn" title="切换展厅或书架主题" aria-label="切换展厅或书架主题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H19"/></svg></button>
      <button class="sidebar-action sidebar-settings" id="menuBtn" title="备份与设置" aria-label="备份与设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg><span>备份与设置</span></button>
    </div>
  </div>
</aside>
<button class="sidebar-scrim" id="sidebarScrim" tabindex="-1" aria-label="关闭导航菜单" hidden></button>

<div class="app-shell" id="appShell" data-view="home">

<header class="topbar" id="topbar">
  <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="打开导航" aria-label="打开导航" aria-expanded="false" aria-controls="appSidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4"/><path d="M5 8v12h14V8M10 12h4"/></svg>
    <div>
      <div class="brand-title">娱乐档案</div>
      <div class="brand-sub" id="brandSub">PERSONAL ARCHIVE</div>
    </div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" aria-label="搜索作品" placeholder="搜标题、标签、简介、经历内容…（按 / 聚焦）">
  </div>
  <div class="topbar-actions">
    <span class="topbar-context" id="topbarContext">正在进行</span>
  </div>
</header>

<main class="app-main">
<section class="home-view" id="homeView" aria-labelledby="homeTitle">
  <div class="home-hero" id="homeHero">
    <div class="home-hero-copy">
      <p class="home-kicker">PERSONAL ARCHIVE</p>
      <h1 id="homeTitle">正在进行</h1>
      <p class="home-hero-summary" id="homeHeroSummary">把当前正在看的作品放在眼前，继续上次的进度。</p>
      <div class="home-hero-actions">
        <button class="btn btn-primary" id="homeContinueBtn"><span>继续浏览</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        <button class="btn" id="homeManageBtn">管理首页作品</button>
      </div>
    </div>
    <div class="home-hero-art" id="homeHeroArt" aria-hidden="true"></div>
  </div>
  <div class="home-feed" id="homeFeed"></div>
</section>

<section class="archive-view" id="archiveView" aria-labelledby="archiveTitle">
<h1 id="archiveTitle" class="sr-only">作品展厅</h1>
<div class="filters">
  <div class="tabs" id="tabs"></div>
  <div class="filters-right">
    <div class="chips" id="statusChips"></div>
    <select class="mini" id="timeSelect" title="添加时间" aria-label="按添加时间筛选">
      <option value="all">全部时间</option>
      <option value="y">今年添加</option>
      <option value="m12">近一年</option>
      <option value="y3">近三年</option>
    </select>
    <select class="mini" id="sortSelect" title="排序" aria-label="作品排序">
      <option value="recent">最近添加</option>
      <option value="activity">最近经历</option>
      <option value="scoreDesc">评分高→低</option>
      <option value="scoreAsc">评分低→高</option>
      <option value="title">标题</option>
    </select>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="sync-notice" id="syncNotice" role="status" hidden>
  <span>修改已保存，但列表同步失败，系列统计可能尚未更新。</span>
  <button class="btn btn-sm" id="syncRetry">重新同步</button>
</div>

<div class="wall-tools">
  <div class="seg" id="groupSeg" role="group" aria-label="系列显示方式">
    <button data-group="series" class="on">系列折叠</button>
    <button data-group="flat">平铺</button>
  </div>
  <div class="seg" id="sizeSeg" title="主页每行显示数量" role="group" aria-label="主页每行显示数量">
    <button data-size="small" class="on">小</button>
    <button data-size="medium">中</button>
    <button data-size="large">大</button>
  </div>
  <button class="btn btn-sm" id="enterExhibit">进入展厅 ↗</button>
  <button class="btn btn-sm" id="newSeriesBtn">＋ 新建系列</button>
</div>

<div class="wall-wrap">
  <div class="wall" id="wall"></div>
</div>
</section>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<section id="immersiveRoot" class="immersive-layer" role="dialog" aria-modal="true" aria-labelledby="immersiveTitle" hidden></section>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
</main>

<div class="modal" id="musicModal" role="dialog" aria-modal="true" aria-labelledby="musicTitle" aria-hidden="true">
  <div class="modal-box music-modal-box">
    <div class="modal-head"><h2 id="musicTitle">音乐播放器</h2><button class="icon-btn" id="musicClose" aria-label="关闭音乐列表"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <section class="audio-player" id="audioPlayer" aria-label="音乐播放器">
      <div class="audio-player-track"><strong data-player-title>未选择歌曲</strong><span data-player-artist>选择一首歌曲开始播放</span><small data-player-status></small></div>
      <div class="audio-player-controls"><button type="button" data-player-action="previous" aria-label="上一首" title="上一首" disabled>◀</button><button type="button" data-player-action="toggle" aria-label="播放">播放</button><button type="button" data-player-action="next" aria-label="下一首" title="下一首" disabled>▶</button></div>
      <label class="audio-player-volume"><span>音量</span><input type="range" min="0" max="100" step="1" data-player-volume aria-label="音乐音量"><output data-player-volume-value>20%</output></label>
      <span class="audio-player-mode" data-player-mode-label>沉浸</span>
    </section>
    <div class="music-modal-controls"><div class="seg music-mode" role="group" aria-label="播放模式"><button type="button" data-audio-mode="global" aria-pressed="false">全局播放</button><button type="button" data-audio-mode="immersive" aria-pressed="true">沉浸模式</button><button type="button" data-audio-mode="playlist" aria-pressed="false">歌单沉浸</button></div>
      <div class="music-list-tools"><input type="search" id="musicSearch" placeholder="搜索歌曲名、演唱者或作品" aria-label="搜索音乐"><select id="musicCategory" aria-label="按作品分类筛选"><option value="all">全部分类</option><option value="anime">动漫</option><option value="manga">漫画</option><option value="game">游戏</option><option value="novel">网文</option><option value="book">出版书</option><option value="movie">影视剧</option><option value="shortdrama">短剧</option></select><label class="music-shuffle"><input id="musicShuffle" type="checkbox"><span>随机播放</span></label></div>
    </div>
    <div class="modal-body music-track-list" id="musicTrackList" role="list"></div>
    <div class="modal-foot"><span class="music-count" id="musicCount"></span><button class="btn" id="musicCancel">关闭</button><button class="btn btn-primary" id="musicStart">播放全部</button></div>
  </div>
</div>

<div class="modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addTitle" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="addTitle">添加作品</h2>
      <div class="steps" id="addSteps"></div>
    </div>
    <div class="modal-body" id="addBody"></div>
    <div class="modal-foot" id="addFoot"></div>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
  <div class="modal-box" style="width:min(560px,100%)">
    <div class="modal-head">
      <h2 id="settingsTitle">备份与设置</h2>
      <button class="icon-btn" id="settingsClose" style="margin-left:auto" aria-label="关闭设置">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="settingsBody"></div>
    <div class="modal-foot">
      <button class="btn" id="settingsClose2">关闭</button>
      <button class="btn btn-primary" id="saveSettings">保存设置</button>
    </div>
  </div>
</div>

<div class="modal" id="hiddenWorksModal" role="dialog" aria-modal="true" aria-labelledby="hiddenWorksTitle" aria-hidden="true">
  <div class="modal-box home-manage-modal">
    <div class="modal-head"><h2 id="hiddenWorksTitle">管理首页作品</h2><button class="icon-btn" id="hiddenWorksClose" aria-label="关闭管理首页作品">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></div>
    <div class="modal-body" id="hiddenWorksBody"></div>
    <div class="modal-foot"><button class="btn" id="hiddenWorksCancel">关闭</button><button class="btn btn-primary" id="hiddenWorksSave">保存</button></div>
  </div>
</div>

<div class="modal" id="seriesModal" role="dialog" aria-modal="true" aria-labelledby="seriesModalTitle" aria-hidden="true">
  <div class="modal-box" style="width:min(640px,100%)">
    <div class="modal-head">
      <h2 id="seriesModalTitle">新建系列</h2>
      <button class="icon-btn" id="seriesClose" style="margin-left:auto" aria-label="关闭新建系列">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="seriesBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="seriesCancel">取消</button>
      <button class="btn btn-primary" id="seriesSave">创建系列</button>
    </div>
  </div>
</div>

<div class="blocker" id="corruptBlock" hidden>
  <div class="blocker-box" role="alertdialog" aria-modal="true" aria-labelledby="corruptTitle">
    <h2 id="corruptTitle">主档案损坏，已停止写入</h2>
    <div class="blocker-text" id="corruptText"></div>
    <div class="blocker-sub">可用的备份（恢复前会自动保存当前损坏文件的安全快照）：</div>
    <div class="blocker-list" id="corruptBackups"></div>
    <div class="blocker-actions">
      <button class="btn btn-primary" id="corruptRetry">重新检查</button>
      <button class="btn btn-danger" id="corruptNewBtn">新建空档案（保留损坏文件）</button>
    </div>
    <div class="blocker-hint">在恢复或新建之前，作品列表是空的，并且任何修改都不会写入磁盘。</div>
  </div>
</div>

 </div>
<button type="button" class="audio-player-launch" id="audioPlayerLaunch" aria-label="打开音乐播放器" title="音乐播放器">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="audio-player-launch-state" aria-hidden="true"></span>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/presentation-core.js"></script>
<script src="/static/exhibit-cards.js"></script>
<script src="/static/browse-session.js"></script>
<script src="/static/immersive-background.js"></script>
<script src="/static/background-editor.js"></script>
<script src="/static/series-immersive.js"></script>
<script src="/static/immersive-audio.js"></script>
<script src="/static/bgm-editor.js"></script>
<script src="/static/home-feed.js"></script>
<script src="/static/immersive.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
