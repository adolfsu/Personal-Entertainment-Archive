<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>娱乐档案 · 个人档案馆</title>
<script>
try{
  var m = localStorage.getItem('grdag_mode'), t = localStorage.getItem('grdag_theme'), z = localStorage.getItem('grdag_size');
  if (m) document.documentElement.dataset.mode = m;
  if (t) document.documentElement.dataset.theme = t;
  if (z) document.documentElement.dataset.size = z;
}catch(e){}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f2f2f7'/%3E%3Crect x='14' y='14' width='36' height='7' rx='2' fill='%230088ff'/%3E%3Cpath d='M18 21v28h28V21' stroke='%230088ff' stroke-width='3' fill='none'/%3E%3Cpath d='M27 33h10' stroke='%230088ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<a class="skip-link" href="#wall">跳到作品列表</a>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4"/><path d="M5 8v12h14V8M10 12h4"/></svg>
    <div>
      <div class="brand-title">娱乐档案</div>
      <div class="brand-sub" id="brandSub">PERSONAL ARCHIVE</div>
    </div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" aria-label="搜索作品" placeholder="搜标题、标签、简介、经历内容…（按 / 聚焦）">
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="modeBtn" title="切换深色 / 浅色" aria-label="切换深色或浅色模式">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.7 5.7l1.4 1.4M16.9 16.9l1.4 1.4M18.3 5.7l-1.4 1.4M7.1 16.9l-1.4 1.4"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换主题：展厅 / 书架" aria-label="切换展厅或书架主题">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H19"/><path d="M8 7h7M8 10h5"/></svg>
    </button>
    <button class="btn btn-primary" id="addBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      添加作品
    </button>
    <button class="icon-btn" id="menuBtn" title="备份与设置" aria-label="备份与设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </button>
  </div>
</header>

<div class="filters">
  <div class="tabs" id="tabs"></div>
  <div class="filters-right">
    <div class="chips" id="statusChips"></div>
    <select class="mini" id="timeSelect" title="添加时间" aria-label="按添加时间筛选">
      <option value="all">全部时间</option>
      <option value="y">今年添加</option>
      <option value="m12">近一年</option>
      <option value="y3">近三年</option>
    </select>
    <select class="mini" id="sortSelect" title="排序" aria-label="作品排序">
      <option value="recent">最近添加</option>
      <option value="activity">最近经历</option>
      <option value="scoreDesc">评分高→低</option>
      <option value="scoreAsc">评分低→高</option>
      <option value="title">标题</option>
    </select>
  </div>
</div>
<div class="stats" id="stats"></div>

<div class="wall-tools">
  <div class="seg" id="groupSeg" role="group" aria-label="系列显示方式">
    <button data-group="series" class="on">系列折叠</button>
    <button data-group="flat">平铺</button>
  </div>
  <div class="seg" id="sizeSeg" title="主页每行显示数量" role="group" aria-label="主页每行显示数量">
    <button data-size="small" class="on">小</button>
    <button data-size="medium">中</button>
    <button data-size="large">大</button>
  </div>
  <button class="btn btn-sm" id="newSeriesBtn">＋ 新建系列</button>
</div>

<div class="wall-wrap">
  <div class="wall" id="wall"></div>
</div>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addTitle" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="addTitle">添加作品</h2>
      <div class="steps" id="addSteps"></div>
    </div>
    <div class="modal-body" id="addBody"></div>
    <div class="modal-foot" id="addFoot"></div>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
  <div class="modal-box" style="width:min(560px,100%)">
    <div class="modal-head">
      <h2 id="settingsTitle">备份与设置</h2>
      <button class="icon-btn" id="settingsClose" style="margin-left:auto" aria-label="关闭设置">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="settingsBody"></div>
    <div class="modal-foot">
      <button class="btn" id="settingsClose2">关闭</button>
      <button class="btn btn-primary" id="saveSettings">保存设置</button>
    </div>
  </div>
</div>

<div class="modal" id="seriesModal" role="dialog" aria-modal="true" aria-labelledby="seriesModalTitle" aria-hidden="true">
  <div class="modal-box" style="width:min(640px,100%)">
    <div class="modal-head">
      <h2 id="seriesModalTitle">新建系列</h2>
      <button class="icon-btn" id="seriesClose" style="margin-left:auto" aria-label="关闭新建系列">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="seriesBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="seriesCancel">取消</button>
      <button class="btn btn-primary" id="seriesSave">创建系列</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
